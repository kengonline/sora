name: Completion diagnostic
on:
  push:
    branches: [codex/diagnose-autocomplete-backspace]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-input:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install Zig
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform, tarfile, urllib.request
          arch = 'aarch64' if platform.machine() == 'arm64' else 'x86_64'
          index = json.load(urllib.request.urlopen('https://ziglang.org/download/index.json'))
          release = index['0.16.0'][arch + '-macos']
          archive = os.path.join(os.environ['RUNNER_TEMP'], 'zig.tar.xz')
          urllib.request.urlretrieve(release['tarball'], archive)
          assert hashlib.sha256(open(archive, 'rb').read()).hexdigest() == release['shasum']
          with tarfile.open(archive) as tar:
              directory = tar.getnames()[0].split('/')[0]
              tar.extractall(os.environ['RUNNER_TEMP'], filter='data')
          with open(os.environ['GITHUB_PATH'], 'a') as paths:
              paths.write(os.path.join(os.environ['RUNNER_TEMP'], directory) + '\n')
          PY
      - uses: actions/cache@v4
        with:
          path: Vendor/ghostty
          key: ghosttykit-${{ runner.os }}-${{ runner.arch }}-c81f0b26871c7fbbe2fc35549fdad1f64ed29094-${{ hashFiles('Scripts/build-ghosttykit.sh', 'patches/ghostty-semantic-prompt-boundaries.patch') }}
      - name: Instrument native input
        run: python3 Scripts/probe-completion.py
      - name: Build GhosttyKit
        run: bash Scripts/build-ghosttykit.sh
      - name: Build original Sora
        run: |
          set -o pipefail
          xcodebuild -project Sora.xcodeproj -scheme Sora -configuration Debug -destination 'platform=macOS' -derivedDataPath .derivedData build > baseline-build.log 2>&1 || { tail -100 baseline-build.log; exit 1; }
          tail -25 baseline-build.log
      - name: Exercise original native input
        continue-on-error: true
        run: bash Scripts/run-completion-probe.sh baseline
      - name: Apply PR fix and instrument it
        run: |
          git fetch origin codex/fix-autocomplete-backspace
          git checkout FETCH_HEAD -- Sora/Resources/zsh/command-blocks.zsh Sora/Terminal/GhosttySurfaceView.swift SoraTests/SoraZshBootstrapTests.swift
          python3 Scripts/probe-completion.py
      - name: Build and test fixed Sora
        run: |
          set -o pipefail
          xcodebuild -project Sora.xcodeproj -scheme Sora -configuration Debug -destination 'platform=macOS' -derivedDataPath .derivedData -parallel-testing-enabled NO test > fixed-build.log 2>&1 || { tail -100 fixed-build.log; exit 1; }
          tail -25 fixed-build.log
      - name: Exercise fixed native input
        run: bash Scripts/run-completion-probe.sh fixed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-diagnostic
          path: |
            *-build.log
            *-probe.log
